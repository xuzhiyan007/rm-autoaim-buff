# SIFT 模板匹配参数配置
# specific_pts: 模板图像原始分辨率下的像素坐标，运行时会根据模板缩放参数自动缩放

r_template:
  specific_pts:
    - [14.0, 12.0]
  sift:
    nfeatures: 200      # 限制特征点数，降低耗时（原为0=不限）
    nOctaveLayers: 3
    contrastThreshold: 0.01
    edgeThreshold: 10
    sigma: 1.6
  min_matches: 4
  ratio_test: 0.7

circle_template:
  specific_pts:
    - [40.0, 103.0]
    - [18.0, 33.0]
    - [89.0, 15.0]
    - [110.0, 85.0]
  sift:
    nfeatures: 300      # 限制特征点数，降低耗时（原为0=不限）
    nOctaveLayers: 3
    contrastThreshold: 0.01
    edgeThreshold: 30
    sigma: 1.2
  min_matches: 10
  ratio_test: 0.7

roi_detector:
  sift:
    nfeatures: 300      # 限制特征点数，降低耗时（原为0=不限）
    nOctaveLayers: 3
    contrastThreshold: 0.01
    edgeThreshold: 30
    sigma: 1.2

homography:
  ransac_threshold: 5.0
  margin_ratio: 0.1
